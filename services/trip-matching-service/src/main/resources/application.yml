server:
  port: 8082

spring:
  application:
    name: trip-matching-service

  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 20
          min-idle: 5

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: trip-matching-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 500
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3   # 3 consumer threads per partition group

surge:
  service:
    url: ${SURGE_SERVICE_URL:http://localhost:8083}

matching:
  search-radius-km: 5.0       # default search radius
  max-drivers-returned: 10
  driver-ttl-seconds: 30      # remove driver from index if no ping for 30s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    export:
      prometheus:
        enabled: true

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  traces:
    exporter: otlp
  service:
    name: trip-matching-service
  propagators: tracecontext,baggage
