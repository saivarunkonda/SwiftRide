apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ride-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: notification-service
          image: <ECR_REPO>/notification-service:latest
          ports:
            - containerPort: 8084
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: brokers
            - name: AWS_REGION
              value: "us-east-1"
            - name: SNS_TOPIC_ARN_RIDER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: sns_topic_arn_rider
            - name: SNS_TOPIC_ARN_DRIVER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: sns_topic_arn_driver
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4318"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ride-platform
spec:
  selector:
    app: notification-service
  ports:
    - port: 80
      targetPort: 8084
