apiVersion: apps/v1
kind: Deployment
metadata:
  name: surge-pricing-service
  namespace: ride-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: surge-pricing-service
  template:
    metadata:
      labels:
        app: surge-pricing-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      nodeSelector:
        role: memory-optimized   # Kafka Streams is memory-heavy
      containers:
        - name: surge-pricing-service
          image: <ECR_REPO>/surge-pricing-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: brokers
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4318"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: surge-pricing-service
  namespace: ride-platform
spec:
  selector:
    app: surge-pricing-service
  ports:
    - port: 80
      targetPort: 8083
