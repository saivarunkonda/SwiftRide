apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ride-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: user-service
          image: <ECR_REPO>/user-service:latest
          ports:
            - containerPort: 8086
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: rds-secret
                  key: host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rds-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-secret
                  key: password
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: brokers
            - name: COGNITO_JWKS_URI
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: cognito_jwks_uri
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4318"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ride-platform
spec:
  selector:
    app: user-service
  ports:
    - port: 80
      targetPort: 8086
