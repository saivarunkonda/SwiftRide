apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-matching-service
  namespace: ride-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trip-matching-service
  template:
    metadata:
      labels:
        app: trip-matching-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: trip-matching-service
          image: <ECR_REPO>/trip-matching-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: brokers
            - name: ELASTICSEARCH_URI
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: elasticsearch_uri
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: host
            - name: SURGE_SERVICE_URL
              value: "http://surge-pricing-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4318"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: trip-matching-service
  namespace: ride-platform
spec:
  selector:
    app: trip-matching-service
  ports:
    - port: 80
      targetPort: 8082
