apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ride-platform
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/<YOUR_ORG>/ride-platform
    targetRevision: main
    path: infra/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: ride-platform

  syncPolicy:
    automated:
      prune: true       # remove resources deleted from git
      selfHeal: true    # revert manual kubectl changes
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
